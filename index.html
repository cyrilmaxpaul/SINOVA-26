    <title>SINOVA'26 — Event Intelligence</title>
    <!-- No-flash background: apply the last-known custom background/accent before first
         paint, so the default gradient never flashes while Firestore loads the real one. -->
    <script>
      (function () {
        try {
          var r = document.documentElement;
          var bg = localStorage.getItem("sinova-appbg");
          var accent = localStorage.getItem("sinova-accent");
          // Apply the last-known background; if none cached yet, fall back to a plain
          // (theme-colored) background rather than the blue gradient — no blue flash.
          r.style.setProperty("--app-bg", bg || "none");
          if (accent) {
            r.style.setProperty("--primary", accent);
            r.style.setProperty("--ring", accent);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
